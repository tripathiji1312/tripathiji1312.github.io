baseURL: "https://tripathiji1312.github.io/"
title: "Swarnim Tripathi"
theme: "PaperMod"
defaultContentLanguage: "en"
copyright: "© 2026 Swarnim Tripathi"

# Enables sitemap.xml generation (critical for Google indexing)
enableRobotsTXT: true

services:
  googleAnalytics:
    id: "G-6LD479KS5L"

# This is required to make the Search functionality work
outputs:
  home:
    - HTML
    - RSS
    - JSON 

# SEO: Keywords for the entire site
params:
  analytics:
    google:
      SiteVerificationTag: "pMC060M3OeUsp0smKjassCkHJrqqMeImAL2tgeNzaws"
  env: "production"
  description: "Swarnim Tripathi — Machine Learning Engineer specializing in ML Systems, Inference Optimization, and PyTorch internals. Open-source contributor to PyTorch. Undergrad at VIT Chennai."
  author: "Swarnim Tripathi"
  keywords:
    - "Swarnim Tripathi"
    - "Machine Learning Engineer"
    - "ML Systems"
    - "PyTorch"
    - "Inference Optimization"
    - "Deep Learning"
    - "VIT Chennai"
    - "Open Source"
    - "AI Research"

  # Schema.org: tells Google this is a Person, not a company
  schema:
    publisherType: "Person"

  # Enable KaTeX math rendering via extend_head.html
  math: true

  # UI & Aesthetics
  defaultTheme: "dark"
  disableThemeToggle: false
  ShowReadingTime: true
  ShowCodeCopyButtons: true
  ShowBreadCrumbs: true
  ShowPostNavLinks: true
  disableScrollToTop: false
  ShowShareButtons: true        # Adds share buttons for social reach

  # Home Info Mode - shows intro at top, then posts below
  homeInfoParams:
    Title: "👋 Hey, I'm Swarnim!"
    Content: >
      Machine Learning Engineer obsessed with **ML Systems**, **Inference Optimization**, and **PyTorch internals**. Here I am documenting everything I make or work on.. soo yeah.

  # Your Social Links
  socialIcons:
    - name: "github"
      url: "https://github.com/tripathiji1312"
    - name: "linkedin"
      url: "https://linkedin.com/in/swarnim-trip"
    - name: "link"
      url: "https://tripathiji.vercel.app/"
    - name: "email"
      url: "mailto:swarnim.tr@gmail.com"

  # Ensure homepage shows posts from `posts` section
  mainSections:
    - "posts"

  # Favicons and related assets (local files in /static/)
  assets:
    favicon: "/favicon.ico"
    favicon16x16: "/favicon-16x16.png"
    favicon32x32: "/favicon-32x32.png"
    apple_touch_icon: "/apple-touch-icon.png"
    theme_color: "#1a1a2e"

# Sitemap configuration
sitemap:
  changeFreq: "weekly"
  priority: 0.5

# The Top Navigation Menu
menu:
  main:
    - identifier: "posts"
      name: "Posts"
      url: "/posts/"
      weight: 10
    - identifier: "archives"
      name: "Archive"
      url: "/archives/"
      weight: 20
    - identifier: "search"
      name: "Search"
      url: "/search/"
      weight: 30
    - identifier: "tags"
      name: "Tags"
      url: "/tags/"
      weight: 40

# Markup configuration for proper heading IDs (SEO anchor links) and math passthrough
markup:
  goldmark:
    renderer:
      unsafe: true
    extensions:
      passthrough:
        delimiters:
          block:
          - - '\['
            - '\]'
          - - $$
            - $$
          inline:
          - - '\('
            - '\)'
        enable: true